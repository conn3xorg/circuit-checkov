name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Scan a planted Terraform file and check checkov reports CKV_AWS_24
        working-directory: examples/local
        run: sudo podman exec -i circuit-checkov sh < check.sh
      # Restarting the container boots systemd again, so this checks checkov is
      # still in place and the plan still has nothing to do.
      - name: Restart the host, then check checkov and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-checkov
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-checkov systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec circuit-checkov checkov --version
          conn3x plan -detailed-exitcode
      # A fresh host gets the previous minor release from the lock in
      # tests/upgrade, then the circuit's own pin is applied over it, the way
      # someone moves to a new release of this circuit.
      - name: Upgrade from checkov 3.3.30 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var checkov_version=3.3.30 -var requirements_file=../../tests/upgrade/checkov-3.3.30.txt
          test "$(sudo podman exec circuit-checkov checkov --version)" = 3.3.30
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          test "$(sudo podman exec circuit-checkov checkov --version)" = "$(conn3x output -raw checkov_version)"
      - name: Check the upgraded checkov still reports CKV_AWS_24
        working-directory: examples/local
        run: sudo podman exec -i circuit-checkov sh < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
